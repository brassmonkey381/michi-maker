<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QA Console</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --line: #262b35; --ink: #e6e9ef; --dim: #8b93a3;
    --accent: #6ea8fe; --pass: #4ade80; --fail: #f87171; --void: #fbbf24; --skip: #6b7280;
    --danger-read: #2c3340; --danger-local: #3a3320; --danger-user: #4a2a1c; --danger-ledger: #4a1c1c;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 14px/1.5 ui-sans-serif, system-ui, "Segoe UI", sans-serif; }
  header { display: flex; align-items: baseline; gap: 16px; padding: 14px 20px;
           border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 5; }
  header h1 { font-size: 15px; margin: 0; letter-spacing: .02em; }
  header .sub { color: var(--dim); font-size: 12px; }
  nav { margin-left: auto; display: flex; gap: 4px; }
  nav button { background: transparent; border: 1px solid transparent; color: var(--dim);
               padding: 5px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; }
  nav button.on { background: var(--bg); border-color: var(--line); color: var(--ink); }
  main { padding: 20px; max-width: 1280px; margin: 0 auto; }
  .screen { display: none; } .screen.on { display: block; }
  .cols { display: grid; grid-template-columns: 300px 1fr; gap: 20px; align-items: start; }
  @media (max-width: 880px) { .cols { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 16px; }
  .card h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim);
             margin: 0 0 10px; font-weight: 600; }
  label.row { display: flex; gap: 9px; align-items: flex-start; padding: 5px 0; cursor: pointer; }
  label.row input { margin-top: 3px; }
  label.row.off { opacity: .45; cursor: not-allowed; }
  label.row .t { font-weight: 500; }
  label.row .d { color: var(--dim); font-size: 12px; display: block; }
  .budget { border-radius: 8px; padding: 12px 14px; margin: 14px 0; border: 1px solid var(--line);
            background: var(--danger-read); }
  .budget.writes-local { background: var(--danger-local); }
  .budget.writes-user-data { background: var(--danger-user); }
  .budget.writes-ledger, .budget.money { background: var(--danger-ledger); border-color: var(--fail); }
  .budget p { margin: 0 0 6px; } .budget p:last-child { margin: 0; }
  button.go { width: 100%; padding: 11px; border-radius: 8px; border: 1px solid var(--accent);
              background: var(--accent); color: #0b1020; font-weight: 650; font-size: 14px; cursor: pointer; }
  button.go[disabled] { opacity: .5; cursor: default; }
  button.ghost { background: transparent; border: 1px solid var(--line); color: var(--ink);
                 padding: 7px 12px; border-radius: 7px; cursor: pointer; font-size: 13px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--dim); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
  td.id { font-family: ui-monospace, Consolas, monospace; font-size: 12px; color: var(--dim); }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11px; font-weight: 650; }
  .PASS { background: rgba(74,222,128,.15); color: var(--pass); }
  .FAIL { background: rgba(248,113,113,.15); color: var(--fail); }
  .VOID { background: rgba(251,191,36,.15); color: var(--void); }
  .BLOCKED { background: rgba(248,113,113,.15); color: var(--fail); }
  .SKIP, .NA, .WAIVED { background: rgba(107,114,128,.2); color: var(--skip); }
  .counts { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .counts .pill { padding: 4px 12px; font-size: 12px; }
  pre.log { background: #0b0d11; border: 1px solid var(--line); border-radius: 8px; padding: 12px;
            max-height: 460px; overflow: auto; font-size: 12px; line-height: 1.7;
            font-family: ui-monospace, Consolas, monospace; white-space: pre-wrap; margin: 0; }
  .detail { color: var(--dim); font-size: 12px; }
  .banner { border: 1px solid var(--fail); background: rgba(248,113,113,.1); border-radius: 8px;
            padding: 12px 14px; margin-bottom: 16px; }
  .muted { color: var(--dim); }
  select { background: var(--bg); color: var(--ink); border: 1px solid var(--line);
           border-radius: 6px; padding: 5px 8px; width: 100%; }
  .up { color: var(--pass); } .down { color: var(--fail); }
  details summary { cursor: pointer; color: var(--dim); font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>QA Console</h1>
  <span class="sub">michi-maker.com and tcgscan.ai</span>
  <nav>
    <button data-screen="plan" class="on">Plan</button>
    <button data-screen="live">Live</button>
    <button data-screen="report">Report</button>
    <button data-screen="personas">Personas</button>
  </nav>
</header>

<main>
  <section class="screen on" id="screen-plan">
    <div class="cols">
      <div>
        <div class="card">
          <h2>App</h2>
          <div id="apps"></div>
        </div>
        <div class="card">
          <h2>Persona</h2>
          <div id="personas"></div>
        </div>
        <div class="card">
          <h2>Target</h2>
          <select id="target"></select>
          <p class="muted" style="font-size:12px;margin:8px 0 0" id="target-note"></p>
        </div>
        <div class="card">
          <h2>Viewport</h2>
          <select id="viewport">
            <option value="laptop">laptop 1440x900</option>
            <option value="desktop">desktop 1920x1080</option>
            <option value="mid">mid 1024x768</option>
            <option value="phone">phone 390x844</option>
          </select>
          <label class="row" style="margin-top:10px">
            <input type="checkbox" id="heavy">
            <span><span class="t">Include heavy pages</span>
            <span class="d">Scanner model and full catalog downloads. Slower, and the only way to check the scanner.</span></span>
          </label>
        </div>
      </div>

      <div>
        <div class="card">
          <h2>Audit area</h2>
          <div id="areas"></div>
        </div>

        <div class="card">
          <h2>What this run will do</h2>
          <div id="budget"></div>
          <button class="go" id="run">Run the gamut</button>
        </div>

        <div class="card">
          <h2>Selected checks (<span id="count">0</span>)</h2>
          <div style="max-height:360px;overflow:auto">
            <table><tbody id="selected"></tbody></table>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section class="screen" id="screen-live">
    <div class="card">
      <h2>Run</h2>
      <div id="live-status" class="muted">Nothing running.</div>
      <div class="counts" id="live-counts"></div>
      <div id="live-rollup"></div>
      <pre class="log" id="live-log"></pre>
    </div>
  </section>

  <section class="screen" id="screen-report">
    <div class="card">
      <h2>Past runs</h2>
      <select id="run-pick"></select>
    </div>
    <div id="report-body"></div>
  </section>

  <section class="screen" id="screen-personas">
    <div class="card">
      <h2>Doctor</h2>
      <button class="ghost" id="doctor-go">Check targets and personas</button>
      <div id="doctor-out" style="margin-top:14px"></div>
    </div>
  </section>
</main>

<script>
const $ = (s) => document.querySelector(s);
const el = (tag, attrs = {}, kids = []) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') n.className = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const kid of [].concat(kids)) n.append(kid);
  return n;
};

// ONE LINE PER CAPABILITY. The per-check list is a log; this is the report. Sixty-nine rows do not
// answer "what did it actually test?" and this does.
function rollupTable(rows) {
  const body = el('tbody');
  for (const r of rows) {
    body.append(el('tr', {}, [
      el('td', {}, el('span', { class: 'pill ' + (r.verdict === 'ok' ? 'PASS' : r.verdict === 'PARTIAL' ? 'SKIP' : r.verdict) }, r.verdict)),
      el('td', {}, el('strong', {}, r.group)),
      el('td', {}, r.passed + '/' + r.total),
      el('td', { class: 'detail' }, (r.personas || []).join(', ')),
      el('td', { class: 'detail' }, r.headline || ''),
    ]));
  }
  return el('table', {}, [
    el('thead', {}, el('tr', {}, [el('th', {}, ''), el('th', {}, 'capability'), el('th', {}, 'held'), el('th', {}, 'covered'), el('th', {}, 'what happened')])),
    body,
  ]);
}

let catalog = null;
const state = { apps: ['michi', 'tcgscan'], areas: [], personas: ['guest'], target: 'prod', viewport: 'laptop', includeHeavy: false };

document.querySelectorAll('nav button').forEach((b) => {
  b.addEventListener('click', () => {
    document.querySelectorAll('nav button').forEach((x) => x.classList.toggle('on', x === b));
    document.querySelectorAll('.screen').forEach((s) => s.classList.toggle('on', s.id === 'screen-' + b.dataset.screen));
    if (b.dataset.screen === 'report') loadRuns();
  });
});

function checkbox(id, label, desc, checked, disabled, onchange) {
  const input = el('input', { type: 'checkbox' });
  input.checked = checked;
  input.disabled = disabled;
  input.addEventListener('change', () => onchange(input.checked));
  return el('label', { class: 'row' + (disabled ? ' off' : '') }, [
    input,
    el('span', {}, [el('span', { class: 't' }, label), el('span', { class: 'd' }, desc)]),
  ]);
}

async function boot() {
  catalog = await (await fetch('/api/catalog')).json();
  state.areas = catalog.areas.map((a) => a.area);

  $('#apps').append(
    checkbox('michi', 'michi-maker.com', 'Binder maker', true, false, (v) => toggle(state.apps, 'michi', v)),
    checkbox('tcgscan', 'tcgscan.ai', 'Scanner and collection', true, false, (v) => toggle(state.apps, 'tcgscan', v)),
  );

  for (const p of catalog.personas) {
    $('#personas').append(
      checkbox(p.id, p.label, p.available ? p.blurb : 'PHASE 2. ' + p.reason, state.personas.includes(p.id), !p.available,
        (v) => toggle(state.personas, p.id, v)),
    );
  }

  for (const a of catalog.areas) {
    $('#areas').append(
      checkbox(a.area, a.label + '  (' + a.count + ')', a.blurb, true, false, (v) => toggle(state.areas, a.area, v)),
    );
  }

  const t = $('#target');
  for (const tg of catalog.targets) {
    const o = el('option', { value: tg.id }, tg.ready ? tg.label : tg.label + '  (not running)');
    if (!tg.ready) o.disabled = true;
    t.append(o);
  }
  t.value = 'prod';
  t.addEventListener('change', () => {
    state.target = t.value;
    const tg = catalog.targets.find((x) => x.id === t.value);
    $('#target-note').textContent = tg?.ready === false ? tg.reason : (tg?.note || '');
    refresh();
  });
  $('#target-note').textContent = catalog.targets.find((x) => x.id === 'prod')?.note || '';

  $('#viewport').addEventListener('change', (e) => { state.viewport = e.target.value; refresh(); });
  $('#heavy').addEventListener('change', (e) => { state.includeHeavy = e.target.checked; refresh(); });
  $('#run').addEventListener('click', start);
  $('#doctor-go').addEventListener('click', runDoctor);

  refresh();
}

function toggle(list, value, on) {
  const i = list.indexOf(value);
  if (on && i < 0) list.push(value);
  if (!on && i >= 0) list.splice(i, 1);
  refresh();
}

let refreshTimer = null;
function refresh() {
  clearTimeout(refreshTimer);
  refreshTimer = setTimeout(async () => {
    const r = await (await fetch('/api/plan', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(state) })).json();
    $('#count').textContent = r.count;

    const b = $('#budget');
    b.className = 'budget ' + r.budget.worst;
    b.innerHTML = '';
    if (!r.count) {
      b.append(el('p', {}, 'Nothing selected.'));
    } else {
      b.append(el('p', {}, r.count + ' checks, ' + state.personas.join(' and ') + ', against ' + state.target + '.'));
      for (const s of r.budget.sentences) b.append(el('p', {}, s));
    }

    $('#run').disabled = !r.count;
    $('#run').textContent = r.count ? 'Run ' + r.count + ' checks' : 'Nothing to run';

    const rows = $('#selected');
    rows.innerHTML = '';
    for (const c of r.checks) {
      rows.append(el('tr', {}, [
        el('td', { class: 'id' }, c.id),
        el('td', {}, c.title),
        el('td', {}, el('span', { class: 'pill ' + (c.danger === 'read-only' ? 'SKIP' : 'VOID') }, c.danger)),
      ]));
    }
  }, 120);
}

let seen = 0;
let poll = null;

async function start() {
  const res = await fetch('/api/run', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(state) });
  if (res.status === 409) { alert('A run is already in flight.'); return; }
  seen = 0;
  $('#live-log').textContent = '';
  document.querySelector('nav button[data-screen="live"]').click();
  clearInterval(poll);
  poll = setInterval(tick, 700);
  tick();
}

async function tick() {
  const r = await (await fetch('/api/live?since=' + seen)).json();
  seen = r.total;
  const log = $('#live-log');
  for (const e of r.events) {
    if (e.type === 'check') {
      log.append(e.status.padEnd(8) + e.id + '  [' + e.persona + ']\n');
      if (e.detail && (e.status === 'FAIL' || e.status === 'VOID')) log.append('        ' + String(e.detail).slice(0, 200) + '\n');
    } else if (e.type === 'plan') {
      log.append('plan: ' + e.selected + ' checks\n');
      for (const s of e.budget.sentences) log.append('  ' + s + '\n');
    } else if (e.type === 'persona') {
      log.append('persona ' + e.persona + ': ' + e.kind + (e.tier ? ' (' + e.tier + ')' : '') + '  ' + (e.note || '') + '\n');
    } else if (e.type === 'group') {
      log.append('\n-- ' + e.app + ' as ' + e.persona + ', ' + e.checks + ' checks --\n');
    } else if (e.type === 'done') {
      log.append('\ndone. exit ' + e.exitCode + '\n');
    } else if (e.type === 'crashed') {
      log.append('\nCRASHED: ' + e.detail + '\n');
    }
  }
  log.scrollTop = log.scrollHeight;

  $('#live-status').textContent = r.running
    ? 'Running since ' + new Date(r.startedAt).toLocaleTimeString()
    : (r.runId ? 'Finished: ' + r.runId + (r.exitCode === 4 ? '  A SAFETY GUARD FIRED' : '') : 'Nothing running.');

  const c = $('#live-counts');
  c.innerHTML = '';
  if (r.counts) for (const [k, n] of Object.entries(r.counts)) if (n) c.append(el('span', { class: 'pill ' + k }, k + ' ' + n));

  const sum = $('#live-rollup');
  sum.innerHTML = '';
  if (r.rollup) {
    sum.append(el('h2', {}, 'What was tested'));
    sum.append(rollupTable(r.rollup));
  }

  if (!r.running && r.runId) { clearInterval(poll); loadRuns(); }
}

async function loadRuns() {
  const cat = await (await fetch('/api/catalog')).json();
  const pick = $('#run-pick');
  const current = pick.value;
  pick.innerHTML = '';
  for (const r of cat.runs) pick.append(el('option', { value: r }, r));
  if (current && cat.runs.includes(current)) pick.value = current;
  pick.onchange = () => showReport(pick.value);
  if (pick.value) showReport(pick.value);
}

async function showReport(runId) {
  const r = await (await fetch('/api/report?run=' + encodeURIComponent(runId))).json();
  const out = $('#report-body');
  out.innerHTML = '';

  if (r.guardTripped) {
    out.append(el('div', { class: 'banner' }, [
      el('strong', {}, 'A safety guard fired. '),
      'A check tried to reach ' + r.guardTripped.url + '. The run is not valid; fix the check.',
    ]));
  }

  const counts = el('div', { class: 'counts' });
  for (const [k, n] of Object.entries(r.counts)) if (n) counts.append(el('span', { class: 'pill ' + k }, k + ' ' + n));
  out.append(el('div', { class: 'card' }, [
    el('h2', {}, r.runId),
    el('p', { class: 'muted' }, r.target + ', ' + r.apps.join(' and ') + ', ' + r.personas.join(' and ')),
    counts,
  ]));

  if (r.rollup) {
    out.append(el('div', { class: 'card' }, [
      el('h2', {}, 'What was tested'),
      el('p', { class: 'muted', style: 'font-size:12px;margin:0 0 10px' }, 'One line per capability, worst first. Read the detail below only for what failed.'),
      rollupTable(r.rollup),
    ]));
  }

  const bad = r.checks.filter((c) => c.status === 'FAIL' || c.status === 'VOID');
  if (bad.length) {
    const body = el('tbody');
    for (const c of bad) {
      body.append(el('tr', {}, [
        el('td', {}, el('span', { class: 'pill ' + c.status }, c.status)),
        el('td', {}, [
          el('div', {}, c.title),
          el('div', { class: 'id' }, c.id + '  [' + c.persona + ']'),
          el('div', { class: 'detail' }, c.detail || ''),
          el('details', {}, [el('summary', {}, 'what this protects'), el('div', { class: 'detail' }, c.proves || '')]),
          c.shot ? el('a', { href: '/shots/' + r.runId + '/' + c.shot, target: '_blank', class: 'detail' }, 'screenshot') : el('span'),
        ]),
      ]));
    }
    out.append(el('div', { class: 'card' }, [el('h2', {}, 'Needs attention'), el('table', {}, body)]));
  }

  const all = el('tbody');
  for (const c of r.checks) {
    all.append(el('tr', {}, [
      el('td', {}, el('span', { class: 'pill ' + c.status }, c.status)),
      el('td', { class: 'id' }, c.id),
      el('td', {}, c.persona),
      el('td', { class: 'detail' }, (c.detail || '').slice(0, 160)),
    ]));
  }
  out.append(el('div', { class: 'card' }, [el('h2', {}, 'Every check'), el('table', {}, all)]));
}

async function runDoctor() {
  $('#doctor-out').textContent = 'checking...';
  const d = await (await fetch('/api/doctor')).json();
  const out = $('#doctor-out');
  out.innerHTML = '';

  const sec = el('tbody');
  for (const s of d.secrets.allowed) {
    sec.append(el('tr', {}, [el('td', {}, s.key), el('td', { class: s.present ? 'up' : 'down' }, s.present ? 'present' : 'missing')]));
  }
  out.append(el('div', { class: 'card' }, [
    el('h2', {}, 'Secrets, names only'),
    el('table', {}, sec),
    el('p', { class: 'muted', style: 'font-size:12px' }, 'Refused by design, and unreadable by the rig: ' + d.secrets.refused.join(', ')),
  ]));

  const tg = el('tbody');
  for (const t of d.targets) {
    tg.append(el('tr', {}, [
      el('td', { class: t.reachable ? 'up' : 'down' }, t.reachable ? 'up' : 'down'),
      el('td', {}, t.app), el('td', {}, t.target), el('td', { class: 'detail' }, t.detail),
    ]));
  }
  out.append(el('div', { class: 'card' }, [el('h2', {}, 'Targets'), el('table', {}, tg)]));

  const ps = el('tbody');
  for (const p of d.personas) {
    ps.append(el('tr', {}, [
      el('td', { class: p.available ? 'up' : '' }, p.available ? 'ready' : 'phase 2'),
      el('td', {}, p.label),
      el('td', {}, p.tierFound || '-'),
      el('td', { class: 'detail' }, p.note || ''),
    ]));
  }
  out.append(el('div', { class: 'card' }, [el('h2', {}, 'Personas'), el('table', {}, ps)]));
}

boot();
</script>
</body>
</html>
